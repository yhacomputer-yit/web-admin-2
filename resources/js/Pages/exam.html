<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Answer - Mathematics</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
        }

        /* Breadcrumb Link */
        .sa-breadcrumb {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1.25rem;
            transition: color 0.2s;
        }

        .sa-breadcrumb:hover {
            color: var(--primary);
        }

        /* Flash Message Alert */
        .alert {
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        /* Main Card Panel */
        .sa-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .sa-card-head {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .sa-card-head-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.125rem;
        }

        .sa-card-head-sub {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Exam Meta Data */
        .se-form-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.25rem;
            padding: 1rem 1.5rem;
            background-color: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .se-form-meta i {
            margin-right: 0.25rem;
        }

        /* Badges */
        .se-badge {
            padding: 0.25rem 0.625rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .se-badge-open {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .se-badge-submitted {
            background-color: #d1fae5;
            color: #065f46;
        }

        .se-badge-closed {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .se-form-body {
            padding: 1.5rem;
        }

        /* Currently Submitted State */
        .se-current {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .se-current-head {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #166534;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .se-current-file {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            word-break: break-all;
        }

        .se-current-file.is-missing {
            color: var(--danger);
        }

        .se-current-note {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Blocked State */
        .se-blocked {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            padding: 1.25rem;
            background-color: #fffbebfb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            color: #92400e;
        }

        .se-blocked i {
            font-size: 1.5rem;
            margin-top: 0.125rem;
        }

        .se-blocked-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 0.25rem;
        }

        .se-blocked-sub {
            font-size: 0.85rem;
            color: #b45309;
        }

        /* Drop Zone */
        .se-drop {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .se-drop-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            background-color: #fafafa;
        }

        .se-drop-label:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        .se-drop-label i {
            font-size: 2.25rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .se-drop-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-dark);
            margin-bottom: 0.25rem;
        }

        .se-drop-hint {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .visually-hidden-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Picked File Preview */
        .se-picked {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            background-color: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
        }

        .se-picked i.fa-file {
            color: var(--primary);
        }

        .se-picked-name {
            font-weight: 500;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .se-picked-size {
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .se-picked-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 0.875rem;
            transition: color 0.2s;
        }

        .se-picked-clear:hover {
            color: var(--danger);
        }

        .se-error {
            color: var(--danger);
            font-size: 0.8125rem;
            font-weight: 500;
        }

        /* Action Buttons */
        .se-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .stu-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem 1.25rem;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            background-color: var(--primary);
            color: #ffffff;
            transition: all 0.2s;
        }

        .stu-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .stu-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .stu-btn-ghost {
            background-color: transparent;
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .stu-btn-ghost:hover {
            background-color: #f1f5f9;
            color: var(--text-dark);
        }

        .stu-btn-auto {
            width: auto;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Back Link -->
    <a href="/student-portal/exam" class="sa-breadcrumb">
        <i class="fas fa-chevron-left"></i> Back to exams
    </a>

    <!-- Flash Error Alert (Optional) -->
    <!-- <div class="alert alert-danger">Something went wrong. Please try again.</div> -->

    <div class="sa-card">
        <!-- Subject Header -->
        <div class="sa-card-head">
            <div class="sa-card-head-row">
                <span>Mathematics</span>
                <span class="sa-card-head-sub">Grade 10 - Section A</span>
            </div>
        </div>

        <!-- Exam Sitting Meta -->
        <div class="se-form-meta">
            <span><i class="fas fa-calendar"></i> Oct 03, 2026</span>
            <span><i class="fas fa-clock"></i> 09:00 AM - 11:00 AM</span>
            <span class="se-badge se-badge-open">Open</span>
        </div>

        <div class="se-form-body">
            <!-- Previously Submitted Answer Banner -->
            <div class="se-current" id="submittedBanner" style="display: none;">
                <div class="se-current-head">
                    <i class="fas fa-circle-check"></i>
                    Answer submitted on Oct 03, 2026 at 09:45 AM
                </div>
                <a class="se-current-file" href="/downloads/answer_script.pdf" target="_blank" rel="noopener">
                    <i class="fas fa-paperclip"></i>
                    math_answer_script.pdf
                </a>
                <div class="se-current-note">
                    Uploading again replaces the file above.
                </div>
            </div>

            <!-- Blocked State Banner -->
            <div class="se-blocked" id="blockedBanner" style="display: none;">
                <i class="fas fa-lock"></i>
                <div>
                    <div class="se-blocked-title">Submission Window Closed</div>
                    <div class="se-blocked-sub">
                        Your teacher decides when a sitting opens and closes.
                    </div>
                </div>
            </div>

            <!-- File Upload Form -->
            <form action="/student-portal/exam/1/submit" method="POST" enctype="multipart/form-data" class="se-drop" id="uploadForm">
                <label class="se-drop-label" for="file">
                    <i class="fas fa-cloud-arrow-up"></i>
                    <span class="se-drop-title">Choose your answer script</span>
                    <span class="se-drop-hint">
                        PDF, JPG, PNG or WEBP, up to 20 MB
                    </span>
                </label>

                <input
                    id="file"
                    type="file"
                    name="file"
                    accept=".pdf,.jpg,.jpeg,.png,.webp"
                    required
                    class="visually-hidden-input"
                />

                <!-- Selected File Info Row -->
                <div class="se-picked" id="pickedContainer" style="display: none;">
                    <i class="fas fa-file"></i>
                    <span class="se-picked-name" id="pickedFileName"></span>
                    <span class="se-picked-size" id="pickedFileSize"></span>
                    <button
                        type="button"
                        class="se-picked-clear"
                        id="clearFileBtn"
                        aria-label="Remove the chosen file"
                    >
                        <i class="fas fa-xmark"></i>
                    </button>
                </div>

                <!-- Validation Error Placeholder -->
                <div class="se-error" id="fileError" style="display: none;"></div>

                <!-- Actions -->
                <div class="se-actions">
                    <a href="/student-portal/exam" class="stu-btn stu-btn-ghost stu-btn-auto">
                        Cancel
                    </a>
                    <button
                        type="submit"
                        class="stu-btn stu-btn-auto"
                        id="submitBtn"
                        disabled
                    >
                        <i class="fas fa-paper-plane me-1"></i>
                        <span id="submitBtnText">Submit answer</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file');
    const pickedContainer = document.getElementById('pickedContainer');
    const pickedFileName = document.getElementById('pickedFileName');
    const pickedFileSize = document.getElementById('pickedFileSize');
    const clearFileBtn = document.getElementById('clearFileBtn');
    const submitBtn = document.getElementById('submitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const uploadForm = document.getElementById('uploadForm');

    // Convert bytes into human-readable KB/MB format
    function humanSize(bytes) {
        const kb = Math.ceil(bytes / 1024);
        return kb >= 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${kb} KB`;
    }

    // Handle File Pick Event
    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            pickedFileName.textContent = file.name;
            pickedFileSize.textContent = humanSize(file.size);
            pickedContainer.style.display = 'flex';
            submitBtn.disabled = false;
        } else {
            resetPickedFile();
        }
    });

    // Handle File Removal
    clearFileBtn.addEventListener('click', function() {
        fileInput.value = '';
        resetPickedFile();
    });

    function resetPickedFile() {
        pickedContainer.style.display = 'none';
        submitBtn.disabled = true;
        pickedFileName.textContent = '';
        pickedFileSize.textContent = '';
    }

    // Handle Submit Loading State
    uploadForm.addEventListener('submit', function() {
        submitBtn.disabled = true;
        submitBtnText.textContent = 'Uploading…';
    });
</script>

</body>
</html>
