name: Deploy V3-Test to Hostinger

on:
  push:
    branches:
      - V3-Test
  workflow_dispatch:

concurrency:
  group: hostinger-v3-test-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy over SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, pdo, pdo_mysql, xml, curl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP syntax
        run: |
          find app config routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY_B64"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/hostinger_deploy_key
          chmod 600 ~/.ssh/hostinger_deploy_key

      - name: Trust Hostinger SSH host
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
        run: |
          test -n "$SSH_HOST"
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy files over SSH with rsync
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$REMOTE_PATH"
          REMOTE_PATH="$(printf '%s' "$REMOTE_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test "${REMOTE_PATH#/}" != "$REMOTE_PATH" || { echo "HOSTINGER_REMOTE_PATH must be an absolute path"; exit 1; }
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/hostinger_deploy_key -p $SSH_PORT -o BatchMode=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/logs/' \
            --exclude='storage/framework/cache/' \
            --exclude='storage/framework/sessions/' \
            --exclude='storage/framework/views/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='vendor.zip' \
            --exclude='phpunit.xml' \
            --exclude='README.md' \
            --exclude='DEPLOYMENT.md' \
            ./ "$SSH_USER@$SSH_HOST:$REMOTE_PATH"

      - name: Clear Laravel caches on Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          REMOTE_PATH: ${{ secrets.HOSTINGER_REMOTE_PATH }}
        run: |
          REMOTE_PATH="$(printf '%s' "$REMOTE_PATH" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          test "${REMOTE_PATH#/}" != "$REMOTE_PATH" || { echo "HOSTINGER_REMOTE_PATH must be an absolute path"; exit 1; }
          ssh -i ~/.ssh/hostinger_deploy_key -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" \
            "cd '$REMOTE_PATH' && php artisan optimize:clear && php artisan config:cache"
