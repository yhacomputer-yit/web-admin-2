<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Courses — 3-column mockup</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- the real stylesheets, straight from source: this file cannot drift from the app -->
<link rel="stylesheet" href="../../resources/css/pages/student-portal.css">
<link rel="stylesheet" href="../../resources/css/pages/student-courses.css">
<style>
    /* Mockup page chrome only. Nothing here belongs in the app, and the class
       names are prefixed so they cannot collide with the real stylesheets
       (an earlier .mock-grid wrapper silently overrode the 3-column grid). */
    body {
        margin: 0;
        background: #eef0f4;
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: #1e1e2d;
    }

    .mock-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: .4rem 1.25rem;
        padding: .85rem 1.5rem;
        background: #0f172a;
        color: #94a3b8;
    }

    .mock-bar h1 {
        font-size: .9375rem;
        font-weight: 700;
        margin: 0;
        color: #fff;
    }

    .mock-bar span { font-size: .75rem; }

    .mock-label {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: .25rem .75rem;
        max-width: 1320px;
        margin: 0 auto;
        padding: 2rem 1.5rem .75rem;
    }

    .mock-label h2 {
        font-size: .8125rem;
        font-weight: 800;
        letter-spacing: .06em;
        text-transform: uppercase;
        margin: 0;
        color: #0f172a;
    }

    .mock-label p {
        margin: 0;
        font-size: .8125rem;
        color: #64748b;
    }

    .mock-wrap {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 1.5rem 2.5rem;
    }

    .mock-sheet {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
    }

    .mock-frame {
        border: 1px solid #dfe2e8;
        border-radius: 14px;
        background: #fff;
        padding: .5rem;
    }

    .mock-frame figcaption {
        font-size: .6875rem;
        font-weight: 700;
        letter-spacing: .04em;
        text-transform: uppercase;
        color: #64748b;
        padding: .15rem .25rem .5rem;
    }

    .mock-frame iframe {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 10px;
        background: #f7f8fa;
    }

    [hidden] { display: none !important; }

    @media (max-width: 900px) {
        .mock-sheet { grid-template-columns: minmax(0, 1fr); }
    }
</style>
</head>
<body>

<div class="mock-bar">
    <h1>My Courses &mdash; 3-column workspace</h1>
    <span>courses &rarr; subjects &rarr; materials &rarr; viewer &nbsp;&middot;&nbsp; three columns, never stacked</span>
</div>

<main id="mock-main"></main>

<script>
/*
 * The markup below is generated rather than hand written so the four states
 * cannot drift apart. Class names are exactly the ones the React page renders,
 * and the stylesheets are the app's own, so what you see here is what the app
 * renders. Only the page chrome above is mockup-only.
 */
(function () {
    'use strict';

    /* ---- data: mirrors MOCK_COURSE_LIBRARY ---- */
    var BOOK = function (key, title, desc, pages, size) {
        return { key: key, type: 'book', title: title, desc: desc, meta: 'PDF &middot; ' + size, pages: pages };
    };
    var VIDEO = function (key, title, desc, mins) {
        return { key: key, type: 'video', title: title, desc: desc, meta: 'Video &middot; ' + mins, duration: mins };
    };

    var COURSES = [
        {
            name: 'Mobile Application Development', category: 'Mobile Development', section: 'Section A',
            time: '08:00 - 10:00', enrolled: '14 Sep 2026',
            subjects: [
                { name: 'Android Fundamentals', teacher: 'Dolor Sit Amet', materials: [
                    BOOK('b1', 'Lorem Ipsum Android Handbook', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 312, '9.6 MB'),
                    BOOK('b2', 'Ipsum Dolor Layout Reference', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 148, '4.1 MB'),
                    VIDEO('v1', 'Dolor Sit Amet: Activity Lifecycle', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 12 Sep.', '47 min'),
                    VIDEO('v2', 'Consectetur Adipiscing: Intents', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore.', '36 min')
                ] },
                { name: 'Cross-Platform Basics', teacher: 'Ipsum Dolor', materials: [
                    BOOK('b3', 'Lorem Ipsum React Native Notes', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 226, '7.2 MB'),
                    BOOK('b4', 'Ipsum Dolor Cross-Platform Guide', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 194, '5.4 MB'),
                    VIDEO('v3', 'Tempor Incididunt: Component Basics', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 10 Sep.', '42 min'),
                    VIDEO('v4', 'Ut Labore: Publishing Builds', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.', '29 min')
                ] }
            ]
        },
        {
            name: 'Web Frontend Fundamentals', category: 'Web Development', section: 'Section B',
            time: '10:15 - 12:15', enrolled: '02 Sep 2026',
            subjects: [
                { name: 'HTML and CSS Layout', teacher: 'Consectetur Adipiscing', materials: [
                    BOOK('b5', 'Lorem Ipsum HTML and CSS Reference', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 402, '11.8 MB'),
                    BOOK('b6', 'Ipsum Dolor Typography Handbook', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 168, '3.9 MB'),
                    VIDEO('v5', 'Dolor Sit Amet: Semantic Layouts', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 28 Aug.', '51 min'),
                    VIDEO('v6', 'Consectetur Adipiscing: Flexbox', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore.', '38 min')
                ] },
                { name: 'JavaScript Essentials', teacher: 'Tempor Incididunt', materials: [
                    BOOK('b7', 'Lorem Ipsum JavaScript Handbook', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 356, '10.1 MB'),
                    BOOK('b8', 'Ipsum Dolor DOM Reference', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 122, '2.8 MB'),
                    VIDEO('v7', 'Tempor Incididunt: Events and Delegation', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 24 Aug.', '44 min'),
                    VIDEO('v8', 'Ut Labore: Asynchronous Patterns', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.', '33 min')
                ] }
            ]
        },
        {
            name: 'Database Design and SQL', category: 'Backend Development', section: 'Section A',
            time: '13:30 - 15:30', enrolled: '21 Aug 2026',
            subjects: [
                { name: 'Relational Modeling', teacher: 'Ut Labore', materials: [
                    BOOK('b9', 'Lorem Ipsum Database Systems', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 512, '12.4 MB'),
                    BOOK('b10', 'Ipsum Dolor Entity Design Notes', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 208, '5.6 MB'),
                    VIDEO('v9', 'Dolor Sit Amet: Normalization Steps', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 05 Aug.', '52 min'),
                    VIDEO('v10', 'Consectetur Adipiscing: Keys and Indexes', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore.', '41 min')
                ] },
                { name: 'Query Writing', teacher: 'Eiusmod Tempor', materials: [
                    BOOK('b11', 'Lorem Ipsum SQL Practice Book', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor.', 288, '6.8 MB'),
                    BOOK('b12', 'Ipsum Dolor Query Tuning Guide', 'Lorem ipsum dolor sit amet, sed do eiusmod tempor incididunt ut labore et dolore.', 164, '3.2 MB'),
                    VIDEO('v11', 'Tempor Incididunt: Joins Workshop', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, recorded on 30 Jul.', '46 min'),
                    VIDEO('v12', 'Ut Labore: Stored Procedures', 'Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod.', '31 min')
                ] }
            ]
        }
    ];

    var GROUPS = [
        { key: 'book', label: 'Reference Books', hint: 'PDF', icon: 'fas fa-book', action: 'Download', actionIcon: 'fa-solid fa-download' },
        { key: 'video', label: 'Videos', hint: 'Recordings', icon: 'fas fa-circle-play', action: 'Watch', actionIcon: 'fa-solid fa-play' }
    ];

    /* ---- selection for the state being drawn ---- */
    var VIEW = { course: 0, subject: -1, material: null, step: 1 };

    function activeCourse() { return COURSES[VIEW.course]; }
    function activeSubject() { return VIEW.subject < 0 ? null : activeCourse().subjects[VIEW.subject]; }

    function counts(course) {
        var all = course.subjects.reduce(function (n, s) { return n.concat(s.materials); }, []);
        return {
            books: all.filter(function (m) { return m.type === 'book'; }).length,
            videos: all.filter(function (m) { return m.type === 'video'; }).length
        };
    }

    /* ---- pieces ---- */
    function empty(icon, title, text) {
        return '<div class="mc-empty">'
            + '<span class="mc-empty-icon"><i class="' + icon + '"></i></span>'
            + '<p class="mc-empty-title">' + title + '</p>'
            + '<p class="mc-empty-text">' + text + '</p>'
            + '</div>';
    }

    function stat(icon, label, value) {
        return '<div class="mc-stat"><span class="mc-stat-icon"><i class="' + icon + '"></i></span>'
            + '<span class="mc-stat-body"><span class="mc-stat-label">' + label + '</span>'
            + '<span class="mc-stat-value">' + value + '</span></span></div>';
    }

    function courseColumn() {
        var rows = COURSES.map(function (c, i) {
            var n = counts(c);
            return '<li><button class="mc-row' + (i === VIEW.course ? ' is-active' : '') + '" type="button">'
                + '<img class="mc-row-img" src="" alt="" onerror="this.style.visibility=\'hidden\'">'
                + '<span class="mc-row-body">'
                + '<span class="mc-row-title">' + c.name + '</span>'
                + '<span class="mc-row-tag"><i class="fas fa-tag"></i>' + c.category + '</span>'
                + '<span class="mc-row-meta">'
                + '<span><i class="fas fa-clock"></i>' + c.time + '</span>'
                + '<span><i class="fas fa-calendar"></i>' + c.enrolled + '</span>'
                + '</span>'
                + '<span class="mc-row-foot"><em>' + c.subjects.length + ' subjects</em><em>' + n.books + ' books</em><em>' + n.videos + ' videos</em></span>'
                + '</span></button></li>';
        }).join('');

        return '<div class="mc-pane"><section class="mc-card">'
            + '<header class="mc-head"><span class="mc-head-icon-wrap"><i class="fas fa-book-open"></i></span>'
            + '<span class="mc-head-text"><span class="mc-head-title">My Courses</span>'
            + '<span class="mc-head-sub">' + COURSES.length + ' enrolled</span></span></header>'
            + '<div class="mc-search"><i class="fas fa-magnifying-glass"></i>'
            + '<input class="mc-search-input" type="search" placeholder="Search courses" value=""></div>'
            + '<div class="mc-scroll"><ul class="mc-list">' + rows + '</ul></div>'
            + '</section></div>';
    }

    function subjectColumn() {
        var c = activeCourse();
        var n = counts(c);

        var head = '<section class="mc-card">'
            + '<header class="mc-head mc-head-detail">'
            + '<span class="mc-chip">' + c.category + '</span>'
            + '<h2 class="mc-head-h1">' + c.name + '</h2>'
            + '<span class="mc-head-meta">'
            + '<span><i class="fas fa-layer-group"></i>' + c.section + '</span>'
            + '<span><i class="fas fa-clock"></i>' + c.time + '</span>'
            + '<span><i class="fas fa-calendar"></i>Enrolled ' + c.enrolled + '</span>'
            + '</span></header>'
            + '<div class="mc-stats">'
            + stat('fas fa-book-open', 'Section', c.section)
            + stat('fas fa-layer-group', 'Subjects', c.subjects.length)
            + stat('fas fa-file-lines', 'Books', n.books)
            + stat('fas fa-circle-play', 'Videos', n.videos)
            + '</div></section>';

        var rows = c.subjects.map(function (s, i) {
            var b = s.materials.filter(function (m) { return m.type === 'book'; }).length;
            var v = s.materials.filter(function (m) { return m.type === 'video'; }).length;
            return '<li><button class="mc-subject' + (i === VIEW.subject ? ' is-active' : '') + '" type="button">'
                + '<span class="mc-subject-num">' + (i + 1 < 10 ? '0' : '') + (i + 1) + '</span>'
                + '<span class="mc-subject-body">'
                + '<span class="mc-subject-name">' + s.name + '</span>'
                + '<span class="mc-subject-teacher"><i class="fas fa-user-tie"></i>' + s.teacher + '</span>'
                + '<span class="mc-subject-foot">'
                + '<em class="mc-tag-book"><i class="fas fa-book"></i>' + b + '</em>'
                + '<em class="mc-tag-video"><i class="fas fa-circle-play"></i>' + v + '</em>'
                + '</span></span>'
                + '<i class="fas fa-chevron-right mc-subject-arrow"></i>'
                + '</button></li>';
        }).join('');

        return '<div class="mc-pane">' + head
            + '<section class="mc-card">'
            + '<header class="mc-subhead"><h3 class="mc-subhead-title">Subjects</h3>'
            + '<a class="mc-subhead-link" href="#"><i class="fas fa-arrow-up-right-from-square"></i>Course page</a></header>'
            + '<ul class="mc-list mc-list-flush">' + rows + '</ul>'
            + '</section></div>';
    }

    function matRow(m, g) {
        var on = VIEW.material === m.key;
        return '<li class="mc-mat' + (on ? ' is-active' : '') + '">'
            + '<button class="mc-mat-main" type="button">'
            + '<span class="sa-type-icon sa-type-' + g.key + '"><i class="' + g.icon + '"></i></span>'
            + '<span class="mc-mat-body">'
            + '<span class="mc-mat-title">' + m.title + '</span>'
            + '<span class="mc-mat-desc">' + m.desc + '</span>'
            + '<span class="mc-mat-meta">'
            + '<span><i class="fas ' + (g.key === 'book' ? 'fa-file-pdf' : 'fa-clock') + '"></i>' + m.meta + '</span>'
            + (g.key === 'book' ? '<span>' + m.pages + ' pages</span>' : '')
            + '</span></span></button>'
            + '<a class="mc-btn mc-btn-primary" href="#"><i class="' + g.actionIcon + '"></i>' + g.action + '</a>'
            + '</li>';
    }

    function materialPane() {
        var s = activeSubject();

        /* no subject picked: this is the state the requirement calls for */
        if (!s) {
            return '<div class="mc-pane"><div class="mc-swap"><section class="mc-card">'
                + empty('fas fa-hand-pointer', 'Select a subject to view materials',
                    'Choose a subject in the middle column and its reference books and videos appear here.')
                + '</section></div></div>';
        }

        var b = s.materials.filter(function (m) { return m.type === 'book'; }).length;
        var v = s.materials.filter(function (m) { return m.type === 'video'; }).length;

        var out = '<div class="mc-pane"><div class="mc-swap">'
            + '<section class="mc-card"><header class="mc-head mc-head-detail mc-head-tight">'
            + '<span class="mc-chip mc-chip-quiet">Materials</span>'
            + '<h2 class="mc-head-h1">' + s.name + '</h2>'
            + '<span class="mc-head-meta">'
            + '<span><i class="fas fa-user-tie"></i>' + s.teacher + '</span>'
            + '<span><i class="fas fa-book"></i>' + b + ' books</span>'
            + '<span><i class="fas fa-circle-play"></i>' + v + ' videos</span>'
            + '</span></header></section>';

        GROUPS.forEach(function (g) {
            var items = s.materials.filter(function (m) { return m.type === g.key; });
            out += '<section class="mc-card">'
                + '<header class="mc-subhead"><h3 class="mc-subhead-title">'
                + '<span class="sa-head-icon sa-type-' + g.key + '"><i class="' + g.icon + '"></i></span>' + g.label
                + '</h3><span class="mc-badge">' + items.length + '</span></header>'
                + '<ul class="mc-mat-list">' + items.map(function (m) { return matRow(m, g); }).join('') + '</ul>'
                + '</section>';
        });

        return out + '</div></div>';
    }

    function pdfPage(m) {
        var widths = [96, 88, 92, 74, 90, 84, 95, 88];
        var widths2 = [91, 70, 86, 60, 93, 87, 78];
        function lines(w) {
            return w.map(function (x) { return '<span class="mc-pdf-line" style="width:' + x + '%"></span>'; }).join('');
        }
        return '<div class="mc-pdf">'
            + '<div class="mc-pdf-bar"><span class="mc-pdf-chip">PDF</span>'
            + '<span class="mc-pdf-chip mc-pdf-chip-ghost">Fit width</span>'
            + '<span class="mc-pdf-chip mc-pdf-chip-ghost">1 / ' + m.pages + '</span></div>'
            + '<div class="mc-pdf-page"><h3>' + m.title + '</h3>'
            + '<p class="mc-pdf-lead">Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>'
            + lines(widths) + '<h4>Sed do eiusmod tempor</h4>' + lines(widths2)
            + '<p class="mc-pdf-note"><i class="fas fa-circle-info"></i>Preview placeholder &mdash; the real PDF renders here once the file is uploaded.</p>'
            + '</div></div>';
    }

    function viewerPane() {
        var m = VIEW.material;
        var isBook = m.type === 'book';
        var body = isBook
            ? pdfPage(m)
            : '<div class="mc-video"><div class="mc-video-stage">'
              + '<button class="mc-video-play" type="button"><i class="fas fa-play"></i></button>'
              + '<span class="mc-video-time">' + m.duration + '</span>'
              + '<span class="mc-video-label">Video preview</span></div>'
              + '<div class="mc-video-meta"><h3>' + m.title + '</h3><p>' + m.desc + '</p></div></div>';

        return '<div class="mc-pane"><div class="mc-swap"><section class="mc-card">'
            + '<header class="mc-viewer-bar">'
            + '<button class="mc-ghost-btn" type="button"><i class="fas fa-arrow-left"></i>Materials</button>'
            + '<span class="sa-type-icon sa-type-' + m.type + '"><i class="fas ' + (isBook ? 'fa-file-pdf' : 'fa-circle-play') + '"></i></span>'
            + '<span class="mc-viewer-text"><span class="mc-viewer-name">' + m.title + '</span>'
            + '<span class="mc-viewer-meta">' + m.meta + (isBook ? ' &middot; ' + m.pages + ' pages' : '') + '</span></span>'
            + '<span class="mc-viewer-actions">'
            + '<a class="mc-btn mc-btn-primary" href="#"><i class="fa-solid fa-download"></i>Download</a>'
            + '<button class="mc-btn mc-btn-solid" type="button"><i class="fa-solid fa-expand"></i>Fullscreen</button>'
            + '</span></header>'
            + '<div class="mc-viewer-body">' + body + '</div>'
            + '</section></div></div>';
    }

    function pathBar() {
        var c = activeCourse();
        var s = activeSubject();
        var m = VIEW.material;
        var crumbs = ['Courses', c.name];
        if (s) crumbs.push(s.name);
        if (m) crumbs.push(m.title);

        return '<nav class="mc-path">'
            + '<button class="mc-path-back" type="button"' + (VIEW.step === 1 ? ' disabled' : '') + '><i class="fas fa-chevron-left"></i></button>'
            + '<ol class="mc-path-list">'
            + crumbs.map(function (label, i) {
                return '<li class="mc-path-item' + (i === crumbs.length - 1 ? ' is-current' : '') + '">'
                    + (i ? '<i class="fas fa-chevron-right mc-path-sep"></i>' : '')
                    + '<span>' + label + '</span></li>';
            }).join('')
            + '</ol></nav>';
    }

    /* One state = the full three-column grid, at a given step. */
    function state(step, subjectIndex, materialKey) {
        VIEW.step = step;
        VIEW.subject = subjectIndex;
        VIEW.material = materialKey;

        var focus = step === 1 ? 1 : step === 2 ? 2 : 3;
        /* column three: the viewer replaces the list, never a new column */
        var third = materialKey ? viewerPane() : materialPane();

        return '<div class="mc-root" data-state="' + step + '">'
            + pathBar()
            + '<div class="mc-grid" data-step="' + step + '">'
            + '<div class="mc-col mc-col-courses' + (focus === 1 ? ' is-focused' : '') + '">' + courseColumn() + '</div>'
            + '<div class="mc-col mc-col-subjects' + (focus === 2 ? ' is-focused' : '') + '">' + subjectColumn() + '</div>'
            + '<div class="mc-col mc-col-materials' + (focus === 3 ? ' is-focused' : '') + '">' + third + '</div>'
            + '</div></div>';
    }

    /* ---- page assembly ---- */
    var STATES = [
        { id: 'state-1', step: 1, subject: -1, material: null,
          label: 'Step 1 &mdash; course list',
          note: 'Nothing is picked yet. Column 2 already previews the first course, column 3 holds its empty state.' },
        { id: 'state-2', step: 2, subject: -1, material: null,
          label: 'Step 2 &mdash; course selected, no subject',
          note: 'The required default: column 3 says &ldquo;Select a subject to view materials&rdquo; and shows nothing else.' },
        { id: 'state-3', step: 3, subject: 0, material: null,
          label: 'Step 3 &mdash; subject selected',
          note: 'Column 3 fills with that subject&rsquo;s books and videos. Still three columns, nothing pushed down a row.' },
        { id: 'state-4', step: 4, subject: 0, material: 'b1',
          label: 'Step 4 &mdash; material open',
          note: 'The viewer replaces the list inside column 3. Columns 1 and 2 are untouched and stay on screen.' }
    ];

    var params = new URLSearchParams(location.search);
    var only = params.get('step');

    var html = STATES.map(function (s) {
        return '<div data-state-block="' + s.step + '">'
            + '<div class="mock-label"><h2>' + s.label + '</h2><p>' + s.note + '</p></div>'
            + '<div class="mock-wrap">' + state(s.step, s.subject, s.material) + '</div>'
            + '</div>';
    }).join('');

    html += '<div class="mock-label"><h2>Empty states</h2>'
        + '<p>Every level has one, and each names the next action instead of only reporting nothing.</p></div>'
        + '<div class="mock-wrap"><div class="mock-sheet">'
        + '<section class="mc-root"><section class="mc-card">' + empty('fas fa-hand-pointer', 'Select a subject to view materials', 'Choose a subject in the middle column and its reference books and videos appear here.') + '</section></div>'
        + '<section class="mc-root"><section class="mc-card">' + empty('fas fa-layer-group', 'No subjects yet', 'This course has no subjects assigned, so there is nothing to open.') + '</section></div>'
        + '<section class="mc-root"><section class="mc-card">' + empty('fas fa-folder-open', 'No materials yet', 'Nothing has been uploaded for this subject yet. Check back after the next class.') + '</section></div>'
        + '<section class="mc-root"><section class="mc-card">' + empty('fas fa-magnifying-glass', 'No match', 'Nothing matches &ldquo;react&rdquo;. Try a different word.') + '</section></div>'
        + '</div></div>';

    html += '<div class="mock-label"><h2>Mobile</h2>'
        + '<p>Below 768px the same three columns become a one-screen drill-down. '
        + 'The frames below re-load this file at phone width, so they are the real mobile layout.</p></div>'
        + '<div class="mock-wrap"><div class="mock-sheet">'
        + [1, 2, 3, 4].map(function (n) {
            var names = { 1: 'course list', 2: 'subjects', 3: 'materials', 4: 'viewer' };
            return '<figure class="mock-frame" style="margin:0"><figcaption>Step ' + n + ' &mdash; ' + names[n] + '</figcaption>'
                + '<iframe src="student-courses-3col.html?step=' + n + '" height="1250" title="Mobile step ' + n + '" loading="lazy"></iframe>'
                + '</figure>';
        }).join('')
        + '</div></div>';

    document.getElementById('mock-main').innerHTML = html;

    /* ?step=N renders just that state, for the phone frames above. */
    if (only) {
        document.querySelectorAll('[data-state-block]').forEach(function (el) {
            el.hidden = el.getAttribute('data-state-block') !== only;
        });
        document.querySelectorAll('.mock-label, .mock-sheet, .mock-bar').forEach(function (el) {
            if (!el.closest('[data-state-block]')) el.hidden = true;
        });
    }
})();
</script>

</body>
</html>
